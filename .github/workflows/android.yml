name: Compiler l'APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Préparer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk Plume.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Plume-apk
          path: Plume.apk

      - name: Publier la dernière version
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Plume.apk \
            --title "Plume, dernière version" \
            --notes "APK compilé automatiquement depuis le commit ${GITHUB_SHA::7}. Téléchargez Plume.apk sur votre appareil Android et ouvrez-le pour l'installer." \
            --target "$GITHUB_SHA"
