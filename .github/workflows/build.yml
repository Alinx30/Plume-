name: Compiler Plume (Android, PC, iPad/iPhone)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Préparer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk Plume.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Plume-apk
          path: Plume.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compiler l'installateur Windows
        shell: bash
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          rm -rf web && cp -r ../web web
          npm install --no-audit --no-fund
          npm run dist
          ls dist

      - uses: actions/upload-artifact@v4
        with:
          name: Plume-PC
          path: desktop/dist/Plume-PC-Setup.exe

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Préparer le projet Xcode
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compiler l'appli iPad/iPhone (non signée)
        working-directory: ios
        run: |
          xcodebuild -project Plume.xcodeproj -target Plume -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || true
          grep -E "warning: .*(isolated|Sendable)" build.log | sort -u | head -50 || true
          if [ ! -d build/Release-iphoneos/Plume.app ]; then
            grep -E -A4 "error:" build.log | head -300
            tail -40 build.log
            exit 1
          fi

      - name: Préparer le fichier .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Plume.app Payload/
          zip -qry ../Plume-iOS.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Plume-iOS
          path: Plume-iOS.ipa

  publish:
    needs: [android, windows, ios]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publier la dernière version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Plume.apk Plume-PC-Setup.exe Plume-iOS.ipa \
            --title "Plume, dernière version" \
            --notes "Compilé automatiquement depuis le commit ${GITHUB_SHA::7}.
          - Téléphone Android : téléchargez Plume.apk sur le téléphone et ouvrez-le pour l'installer.
          - PC Windows : téléchargez Plume-PC-Setup.exe et ouvrez-le. Si Windows affiche « Windows a protégé votre ordinateur », cliquez sur « Informations complémentaires » puis « Exécuter quand même ».
          - iPad / iPhone : téléchargez Plume-iOS.ipa sur votre PC et installez-le avec Sideloadly (explications dans le README)." \
            --target "$GITHUB_SHA"
