name: Compiler Plume (Android et PC)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Préparer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk Plume.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Plume-apk
          path: Plume.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compiler l'installateur Windows
        shell: bash
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          rm -rf web && cp -r ../web web
          npm install --no-audit --no-fund
          npm run dist
          ls dist

      - uses: actions/upload-artifact@v4
        with:
          name: Plume-PC
          path: desktop/dist/Plume-PC-Setup.exe

  publish:
    needs: [android, windows]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publier la dernière version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Plume.apk Plume-PC-Setup.exe \
            --title "Plume, dernière version" \
            --notes "Compilé automatiquement depuis le commit ${GITHUB_SHA::7}.
          - Téléphone Android : téléchargez Plume.apk sur le téléphone et ouvrez-le pour l'installer.
          - PC Windows : téléchargez Plume-PC-Setup.exe et ouvrez-le. Si Windows affiche « Windows a protégé votre ordinateur », cliquez sur « Informations complémentaires » puis « Exécuter quand même »." \
            --target "$GITHUB_SHA"
