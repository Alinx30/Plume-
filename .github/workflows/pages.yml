name: Publier la version PC

on:
  push:
    branches: [main]
    paths: ["web/**", "config/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Préparer le site
        run: |
          mkdir -p _site
          cp -r web/. _site/
          cp config/sync.json _site/sync.json
          # Nouvelle version du cache hors ligne à chaque publication.
          sed -i "s/plume-v1/plume-${GITHUB_SHA::7}/" _site/sw.js

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
